 const upd=()=>{const need=multi&&!col,a=$("#po");a.href=need?"#":wa(orderMsg(p,col));a.textContent=need?"اختاري اللون ثم اطلبي":"اطلبي عبر واتساب";a.classList.toggle("dis",need);
  document.querySelectorAll("#cols .cc").forEach(b=>b.classList.toggle("on",b.dataset.col==col))};

  if(c){col=c.dataset.col;$("#cols").classList.remove("need");upd()}
  else if(pi){cur=+pi.dataset.pi;$("#pbig").src=IMG(p.im[cur]);document.querySelectorAll(".th img").forEach(i=>i.classList.toggle("on",i==pi))}

  else if(t.closest("[data-sh]")){const u=(SITE||location.origin)+"/p/"+p.code;try{navigator.clipboard.writeText(u).then(()=>toast("تم نسخ رابط المنتج"),()=>toast(u))}catch(x){toast(u)}}

function route(){const h=decodeURIComponent(location.hash.slice(1));let p=null,vw="list";
 if(h=="branches"&&BR.length>1)vw="br";else if(h=="print"&&PRINT.on)vw="pr";else{p=pf((h.startsWith("p/")?h.slice(2):h).toUpperCase());if(p)vw="p"}
 $("#tabs").hidden=vw=="p";$(".tb").hidden=vw!="list";$("#gr").hidden=vw!="list";$("#bv").hidden=vw!="br";$("#prv").hidden=vw!="pr";$("#pg").hidden=vw!="p";
 tabs(vw);
 if(vw=="p"){showProduct(p);scrollTo(0,0)}else if(vw=="list"){render();if(SY){scrollTo(0,SY);SY=0}}else{if(vw=="pr")showPrint();scrollTo(0,0)}}
function tabs(vw){const t=[["list","#","المنتجات"]];if(PRINT.on)t.push(["pr","#print","طباعة وتصوير"]);if(BR.length>1)t.push(["br","#branches","فروعنا"]);
 $("#tabs").innerHTML=t.length<2?"":t.map(([k,h,n])=>`<a href="${h}" data-t="${k}" class="${k==(vw||"list")?"on":""}">${n}</a>`).join("")}
/* ===== طباعة مستندات ===== */
let PF=[];const MAXB=3*1024*1024,OKX=["pdf","jpg","jpeg","png","webp","doc","docx","ppt","pptx","xls","xlsx"];
const extOf=n=>(n.split(".").pop()||"").toLowerCase();
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" ميجا":Math.max(1,Math.round(n/1024))+" ك.ب";
function b64f(f){return new Promise((ok,bad)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>bad(new Error("read"));r.readAsDataURL(f)})}
function compress(file){return new Promise((ok,bad)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);
 const run=(max,q)=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q))};
 run(2400,.85).then(b=>b.size>MAXB?run(1800,.7):b).then(ok)};i.onerror=()=>bad(new Error("img"));i.src=u})}
function pfRender(){$("#pfl").innerHTML=PF.map((f,i)=>`<div class="pfi"><span>${esc(f.name)}</span><small>${kb(f.size)}${f.manual?" — كبير، هتبعتيه على واتساب مباشرة":""}</small><button type="button" data-pr="${i}" aria-label="حذف">×</button></div>`).join("")}
async function addFiles(list){const m=$("#pmsg");m.hidden=true;
 for(const f of [...list]){if(PF.length>=5){pmsg("الحد الأقصى 5 ملفات.");break}const e=extOf(f.name);
  if(!OKX.includes(e)&&!f.type.startsWith("image/")){pmsg("نوع الملف غير مدعوم: "+f.name);continue}
  try{if(f.type.startsWith("image/")||["jpg","jpeg","png","webp"].includes(e)){const b=await compress(f),nm=f.name.replace(/\.[^.]+$/,"")+".jpg";PF.push({name:nm,size:b.size,blob:b,manual:b.size>MAXB})}
   else PF.push({name:f.name,size:f.size,blob:f,manual:f.size>MAXB})}catch(x){pmsg("تعذّر قراءة الملف: "+f.name)}}
 pfRender()}
function pmsg(t){const m=$("#pmsg");m.hidden=!t;m.textContent=t||"";m.className="mm err"}
async function sendPrint(){
 if(!PF.length){pmsg("اختاري ملفًا واحدًا على الأقل.");return}
 const copies=Math.min(500,Math.max(1,parseInt($("#pc").value,10)||1)),mode=document.querySelector("#pm .cc.on").dataset.pm,notes=$("#pn").value.trim(),btn=$("#psend");
 btn.disabled=true;const links=[],manual=[];
 try{for(let i=0;i<PF.length;i++){const f=PF[i];
  if(f.manual){manual.push(f.name);continue}
  btn.textContent=`جارٍ رفع الملف ${i+1} من ${PF.length}...`;
  try{const r=await fetch("/api/print-upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:await b64f(f.blob)})}),d=await r.json().catch(()=>({}));
   if(!r.ok)throw new Error(d.error||"فشل الرفع");links.push([f.name,d.url])}catch(x){manual.push(f.name);pmsg("تعذّر رفع «"+f.name+"» ("+x.message+")، هتبعتيه على واتساب مباشرة.")}}
  const msg=`مرحبًا مكتبة الكوثر، أرغب في طباعة مستندات:\nطريقة الطباعة: ${mode}\nعدد النسخ: ${copies}`+(links.length?`\nالملفات:\n`+links.map(([n,u],i)=>`${i+1}) ${n}\n${u}`).join("\n"):"")+(manual.length?`\nملفات هبعتها هنا في المحادثة: ${manual.join("، ")}`:"")+(notes?`\nملاحظات: ${notes}`:"");
  const u=wa(msg),go=$("#pgo");go.href=u;go.hidden=false;
  try{if(window.va)window.va("event",{name:"print_order",data:{files:String(PF.length)}})}catch(x){}
  btn.textContent="تم تجهيز الطلب";setTimeout(()=>{location.href=u},500)}
 finally{btn.disabled=false;setTimeout(()=>{btn.textContent="إرسال الطلب عبر واتساب"},1500)}}

 $("#prv").innerHTML=`<div class="pp"><h2>طباعة وتصوير مستندات</h2>
 <p>ارفعي المستند أو الصورة، واختاري عدد النسخ وطريقة الطباعة، وبعدها بنفتح واتساب بالتفاصيل وروابط الملفات.</p>
 ${PRINT.info?`<div class="note">${esc(PRINT.info).replace(/\n/g,"<br>")}</div>`:""}
 <label class="drop" for="pf">اضغطي لاختيار الملفات (حتى 5 ملفات)<br><small>PDF أو Word أو PowerPoint أو Excel أو صور — حتى 3 ميجا للملف</small></label>
 <input id="pf" type="file" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,image/*" hidden><div id="pfl"></div>

 <label>ملاحظات (اختياري)<textarea id="pn" rows="3" placeholder="مثال: وجهين، تدبيس، حجم A3..."></textarea></label>

 <div class="acts"><button class="btn" id="psend" type="button">إرسال الطلب عبر واتساب</button><a class="btn g" id="pgo" hidden target="_blank" rel="noopener">فتح واتساب</a></div></div>`;

 $("#psend").onclick=sendPrint}

$("#up").onclick=()=>scrollTo({top:0,behavior:"smooth"});addEventListener("scroll",()=>{$("#up").style.display=scrollY>400?"block":"none"});
function applySettings(s){
 if(!s)return;
 ["wa","phone","phone2","addr","fb","ig","tg"].forEach(k=>{if(k in s)CFG[k]=s[k]});PRINT={on:s.printEnabled!==false,info:s.printInfo||""};
 if(Array.isArray(s.categories)&&s.categories.length){Object.keys(CATS).forEach(k=>delete CATS[k]);s.categories.forEach(c=>{CATS[c.key]=c.name})}else if(s.cats)Object.assign(CATS,s.cats);
 if(Array.isArray(s.branches))BR=s.branches.map(b=>[b.name,b.addr||"",b.phone||"",b.map||GM("مكتبة الكوثر "+b.name)]);
 SHOW={best:s.showBest!==false,new:s.showNew!==false};
 if(s.title)$("#ttl").textContent=s.title;
 if(s.subtitle!=null)$("#sub").textContent=s.subtitle;
 if(s.logo)$("#lg").src=s.logo;
 if(/^#[0-9a-f]{6}$/i.test(s.accent||"")){const h=s.accent,l=(parseInt(h.slice(1,3),16)*299+parseInt(h.slice(3,5),16)*587+parseInt(h.slice(5,7),16)*114)/1000,r=document.documentElement.style;r.setProperty("--ac",h);r.setProperty("--act",l>150?"#111":"#fff")}
 const an=$("#an"),a=s.announce||{};
 if(a.on&&a.text){an.hidden=false;an.innerHTML=a.link?`<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.text)}</a>`:esc(a.text)}else an.hidden=true;
}

(async()=>{const get=async u=>{try{const c=new AbortController(),t=setTimeout(()=>c.abort(),3500),r=await fetch(u,{signal:c.signal});clearTimeout(t);return r.ok?await r.json():null}catch(e){return null}};
